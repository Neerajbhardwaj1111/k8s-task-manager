services:

  postgres:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpassword

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U taskuser -d taskdb"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7-alpine

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend

    environment:
      DATABASE_URL: postgresql://taskuser:taskpassword@postgres:5432/taskdb
      REDIS_URL: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    ports:
      - "8000:8000"


  frontend:
    build:
      context: ./frontend

    depends_on:
      - backend

    ports:
      - "8080:80"


volumes:
  postgres_data: