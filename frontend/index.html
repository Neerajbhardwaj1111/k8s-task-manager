<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kubernetes Task Manager</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Task Manager</h1>

    <form id="task-form">
        <input
            id="task-input"
            type="text"
            placeholder="Enter a task..."
            required
        >

        <button type="submit">
            Add Task
        </button>
    </form>

    <p id="message"></p>

    <ul id="task-list"></ul>

</div>

<script src="app.js"></script>

</body>
</html>
