apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: task-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: task-manager-backend:1.0

          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8000

          env:

            - name: DATABASE_URL
              value: postgresql://taskuser:taskpassword@postgres-service:5432/taskdb

            - name: REDIS_URL
              value: redis://redis-service:6379/0

          readinessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 20
            periodSeconds: 10